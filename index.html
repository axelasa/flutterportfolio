              "@type": "Answer",
              "text": "A short description of the problem you are solving and who it is for. We shape the rest together on the intro call. If you already have designs or an existing product, we start from there."
            }
          },

            "name": "Who owns the code and the accounts?",
            "acceptedAnswer": {

            }
